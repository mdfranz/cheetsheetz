#set -g allow-passthrough on
#set -s extended-keys on
#set -as terminal-features 'xterm*:extkeys'
#set -sg escape-time 0

# 1. Mouse Support & Event Routing
set -g mouse on

# 2. Escape Sequence Passthrough & System Clipboard (tmux 3.2+)
set -g allow-passthrough on
set -s set-clipboard on

# 3. Prevent auto-cancel on mouse selection
unbind -T copy-mode-vi MouseDragEnd1Pane
unbind -T copy-mode MouseDragEnd1Pane
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-no-clear

# 4. Vi Keys in Copy Mode & Explicit Copy Bindings
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# 5. Fast Escape Response (eliminates delay in CLI prompts/modes)
set -s escape-time 10

# 6. Scrollback History & Terminal Color Support
set -g history-limit 50000
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Optional: Avoid collision with Claude Code's Ctrl+B backgrounding shortcut
unbind C-b
set -g prefix C-a
bind C-a send-prefix
